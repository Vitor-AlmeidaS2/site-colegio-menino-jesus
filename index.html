    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YCZGFKD0QQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Consent Mode (LGPD): nega cookies de análise/anúncios até o usuário aceitar no banner
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
      try {
        if (localStorage.getItem('cmj-cookie-consent') === 'accepted') {
          gtag('consent', 'update', {
            ad_storage: 'granted',
            ad_user_data: 'granted',
            ad_personalization: 'granted',
            analytics_storage: 'granted'
          });
        }
      } catch (e) {}
      gtag('config', 'G-YCZGFKD0QQ');
    </script>

    <!-- Meta Pixel (anúncios do Instagram e do Facebook) -->
    <script>
      // Troque pelo ID do pixel criado em business.facebook.com > Gerenciador de Eventos.
      // Enquanto estiver com o texto abaixo, o pixel fica desligado e nada é enviado.
      window.CMJ_META_PIXEL_ID = 'COLOQUE_O_ID_DO_PIXEL_AQUI';
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      if (window.CMJ_META_PIXEL_ID !== 'COLOQUE_O_ID_DO_PIXEL_AQUI') {
        // LGPD: igual ao Consent Mode do Google — sem aceite no banner, o pixel
        // não grava cookie nem envia dados. O revoke precisa vir antes do init.
        fbq('consent', 'revoke');
        try {
          if (localStorage.getItem('cmj-cookie-consent') === 'accepted') {
            fbq('consent', 'grant');
          }
        } catch (e) {}
        fbq('init', window.CMJ_META_PIXEL_ID);
        fbq('track', 'PageView');
      }
    </script>
